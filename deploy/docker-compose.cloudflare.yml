# Overlay for EDGE_MODE=cloudflare (kept for later; not used in direct mode):
#   CADDYFILE=./Caddyfile.cloudflare docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
# Adds the Cloudflare edge ranges (generated by refresh-cloudflare-ips.sh) and the Origin CA certificate.
services:
  caddy:
    volumes:
      - ./cloudflare-ips.conf:/etc/caddy/cloudflare-ips.conf:ro
      - ./certs:/etc/caddy/certs:ro
