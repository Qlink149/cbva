# Local test only, layered on ../docker-compose.yml (the REAL direct-mode stack): local image, a Mongo container,
# host ports 18080/18443, Caddy's internal CA (local_certs via conf.d) instead of Let's Encrypt, and a second client container.
# Run through stack-test.sh (generates .env.stack).
services:
  api:
    image: cbva-api:smoke
    env_file: !override
      - ./test/.env.stack
  caddy:
    ports: !override
      - "18080:80"
      - "18443:443"
    volumes:
      - ./test/conf.d:/etc/caddy/conf.d:ro
  mongo:
    image: mongo:7
    networks: [internal]
  client:
    image: curlimages/curl
    entrypoint: ["sleep", "3600"]
    networks: [internal]
