name: backend-deploy

on:
  push:
    branches: [main]
    paths: ["backend/**", "deploy/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cbva-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URL: mongodb://localhost:27017
      DATABASE_NAME: cbva_test
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
      FRONTEND_ORIGIN: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: pytest -q
      - name: Dependency audit (runtime deps incl. transitives)
        run: pip-audit -r requirements.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose + Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: /opt/cbva
          strip_components: 1
      - name: Deploy with health check and automatic rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_TAG: ${{ needs.build.outputs.tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: NEW_TAG,GHCR_OWNER,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/cbva
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export GHCR_OWNER
            PREV_TAG="$(cat .current_tag 2>/dev/null || echo '')"
            export TAG="$NEW_TAG"
            docker compose pull api
            docker compose up -d
            ok=0
            for i in $(seq 1 24); do
              st="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo none)"
              if [ "$st" = "healthy" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check failed for $NEW_TAG"; docker compose logs --tail=80 api || true
              if [ -n "$PREV_TAG" ]; then
                echo "Rolling back to $PREV_TAG"; export TAG="$PREV_TAG"; docker compose up -d api
              fi
              exit 1
            fi
            echo "$NEW_TAG" > .current_tag
            [ -n "$PREV_TAG" ] && echo "$PREV_TAG" > .previous_tag || true
            docker image prune -f
